name: CI - Infrared STM32F407 Matrix and Quality

'on':
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrared-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-matrix:
    name: Kconfig and SConscript matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/ci/requirements-ci.txt
      - name: Install Kconfig parser
        run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-ci.txt
      - name: Check workflows and immutable Action pins
        run: python tools/ci/check_workflows.py
      - name: Check all configurations and SCons source selection
        run: python tools/ci/check_matrix.py --all --report _ci/infrared-config-matrix.json
      - name: Upload configuration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infrared-config-matrix
          path: _ci/infrared-config-matrix.json
          if-no-files-found: warn
          retention-days: 14

  stm32f407-build:
    name: STM32F407 / ${{ matrix.rtthread }} / ${{ matrix.profile }}
    needs: config-matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - rtthread: v4.1.1
            profile: legacy-minimal
          - rtthread: v4.1.1
            profile: legacy-nec-rx
          - rtthread: v4.1.1
            profile: legacy-rx-tx
          - rtthread: v4.1.1
            profile: framework-core
          - rtthread: v4.1.1
            profile: framework-pin-nec
          - rtthread: v4.1.1
            profile: framework-capture
          - rtthread: v4.1.1
            profile: framework-pwm
          - rtthread: v4.1.1
            profile: framework-full
          - rtthread: v4.1.1
            profile: framework-sparse
          - rtthread: v4.1.1
            profile: framework-pulse-only
          - rtthread: master
            profile: legacy-minimal
          - rtthread: master
            profile: framework-core
          - rtthread: master
            profile: framework-capture
          - rtthread: master
            profile: framework-pulse-only
    env:
      RTTHREAD_REF: ${{ matrix.rtthread }}
      RTTHREAD_BSP: bsp/stm32/stm32f407-atk-explorer
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python for SCons and Kconfig
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/ci/infrared/requirements-build.txt
      - name: Install ARM GCC and build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            gcc-arm-none-eabi libnewlib-arm-none-eabi git make
          python -m pip install --disable-pip-version-check \
            -r .github/ci/infrared/requirements-build.txt
          arm-none-eabi-gcc --version
          scons --version
      - name: Real SCons compile and STM32F407 ELF link
        shell: bash
        env:
          INFRARED_CI_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p _ci/logs
          sh .github/ci/infrared/build-stm32f407.sh "$INFRARED_CI_PROFILE" \
            2>&1 | tee "_ci/logs/stm32f407-${RTTHREAD_REF}-${INFRARED_CI_PROFILE}.log"
      - name: Upload STM32F407 build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infrared-stm32f407-${{ matrix.rtthread }}-${{ matrix.profile }}
          path: |
            _ci/logs/stm32f407-${{ matrix.rtthread }}-${{ matrix.profile }}.log
            _ci/infrared-profile-${{ matrix.profile }}.h
            _ci/infrared-revisions-${{ matrix.profile }}.txt
            _ci/rt-thread/bsp/stm32/stm32f407-atk-explorer/rt-thread.elf
          if-no-files-found: warn
          retention-days: 14

  cppcheck:
    name: Cppcheck static analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Cppcheck
        run: |
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --version
      - name: Set up Python for effective Kconfig profiles
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/ci/requirements-ci.txt
      - name: Install Kconfig parser
        run: python -m pip install --disable-pip-version-check -r tools/ci/requirements-ci.txt
      - name: Analyze each effective source selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci
          : > _ci/cppcheck.txt
          for profile in $(python tools/ci/check_matrix.py --list-profiles); do
            header="_ci/infrared-profile-${profile}.h"
            sources="_ci/infrared-sources-${profile}.txt"
            python tools/ci/check_matrix.py --profile "$profile" \
              --emit-header "$header" --emit-sources "$sources"
            mapfile -t selected_sources < "$sources"
            echo "Cppcheck effective profile: $profile" | tee -a _ci/cppcheck.txt
            cppcheck --enable=warning,style,performance,portability \
              --std=c11 --quiet --error-exitcode=1 --max-configs=1 \
              --suppress=missingInclude --suppress=missingIncludeSystem \
              --suppress=unusedFunction --include="$header" \
              -Iinc -Isrc -Iframework/inc -Iframework/src \
              -Iframework/src/backends/input -Iframework/src/backends/output \
              -Iframework/codecs/nec -Iframework/codecs/pulse_distance \
              -Iframework/examples \
              "${selected_sources[@]}" 2>&1 | tee -a _ci/cppcheck.txt
          done
      - name: Upload Cppcheck diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infrared-cppcheck
          path: _ci/cppcheck.txt
          if-no-files-found: warn
          retention-days: 14

  documentation:
    name: MkDocs strict and Doxygen warnings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: |
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends doxygen graphviz
          doxygen --version
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Check Doxygen and build API HTML
        run: |
          mkdir -p _ci/doxygen
          doxygen Doxyfile
          test -s _ci/doxygen/html/index.html
      - name: Check MkDocs and combine documentation site
        run: |
          mkdocs build --strict
          mkdir -p site/api
          cp -a _ci/doxygen/html/. site/api/
          test -s site/api/index.html
          touch site/.nojekyll
      - name: Upload documentation warnings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infrared-doxygen-warnings
          path: _ci/doxygen-warnings.log
          if-no-files-found: warn
          retention-days: 14
