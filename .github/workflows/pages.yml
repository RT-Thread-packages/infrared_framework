name: Pages - Infrared Documentation

'on':
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate MkDocs and Doxygen site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: |
          sudo apt-get update -qq -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends doxygen graphviz
          doxygen --version
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Build Doxygen API reference (warnings are errors)
        run: |
          mkdir -p _ci/doxygen
          doxygen Doxyfile
          test -s _ci/doxygen/html/index.html
      - name: Build documentation site (strict)
        run: |
          mkdocs build --strict
          mkdir -p site/api
          cp -a _ci/doxygen/html/. site/api/
          test -s site/api/index.html
          touch site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
